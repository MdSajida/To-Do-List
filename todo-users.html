<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App Register/Login</title>
    <link rel="stylesheet" href="to-do-c.css">
</head>
<body>
    <div class="container">        
        <div id='auth-section' class="form-container">
            <h1>Login</h1>
            <input type="text" id="username" placeholder="Username" autocomplete="on">
            <input type="password" id="password" placeholder="Password">

            <button id="login-button" onclick="handleLogin()">Login</button>
            <button class="secondary" id="Register" onclick=" handleRegister()">Register</button>
            <p class="footer-message">Don’t have an account? Register to get started!</p>
        </div>
        
    <script src="to-do-j-users.js"></script>
  
    </body>
</html>
